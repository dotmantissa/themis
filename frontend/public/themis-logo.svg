<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="themisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4f717" />
      <stop offset="100%" stop-color="#5a38fd" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a38fd" />
      <stop offset="50%" stop-color="#d4f717" />
      <stop offset="100%" stop-color="#5a38fd" />
    </linearGradient>
  </defs>

  <!-- Central Fulcrum Pillar -->
  <path d="M50 15 L50 82" stroke="#24244f" stroke-width="4" stroke-linecap="round" />
  <path d="M50 15 L50 82" stroke="url(#themisGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Base Pedestal -->
  <path d="M30 85 L70 85" stroke="url(#themisGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M22 92 L78 92" stroke="#5a38fd" stroke-width="3" stroke-linecap="round" />

  <!-- Fulcrum Top Diamond Node -->
  <polygon points="50,8 57,17 50,26 43,17" fill="#24244f" stroke="#d4f717" stroke-width="2.5" />
  <circle cx="50" cy="17" r="3" fill="#d4f717" />

  <!-- Dynamic Balance Beam -->
  <path d="M16 28 Q50 24 84 28" stroke="url(#beamGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Left Suspension Strings (DAO Pool) -->
  <line x1="20" y1="29" x2="10" y2="52" stroke="#5a38fd" stroke-width="1.8" stroke-dasharray="2 1.5" />
  <line x1="20" y1="29" x2="30" y2="52" stroke="#5a38fd" stroke-width="1.8" stroke-dasharray="2 1.5" />
  <!-- Left Pan -->
  <path d="M8 52 Q20 64 32 52 Z" fill="#24244f" stroke="#d4f717" stroke-width="2" />
  <circle cx="20" cy="49" r="4" fill="#d4f717" />

  <!-- Right Suspension Strings (Claimant Bond) -->
  <line x1="80" y1="29" x2="70" y2="52" stroke="#5a38fd" stroke-width="1.8" stroke-dasharray="2 1.5" />
  <line x1="80" y1="29" x2="90" y2="52" stroke="#5a38fd" stroke-width="1.8" stroke-dasharray="2 1.5" />
  <!-- Right Pan -->
  <path d="M68 52 Q80 64 92 52 Z" fill="#24244f" stroke="#5a38fd" stroke-width="2" />
  <polygon points="80,45 84,51 76,51" fill="#d4f717" />

  <!-- Center Escrow Shield Core -->
  <circle cx="50" cy="46" r="8" fill="#24244f" stroke="url(#themisGrad)" stroke-width="2" />
  <circle cx="50" cy="46" r="3" fill="#d4f717" />
</svg>
